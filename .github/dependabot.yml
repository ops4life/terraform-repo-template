version: 2
updates:
  - package-ecosystem: "terraform"
    directory: /
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - "terraform"
    # Minor/patch updates in one PR; majors stay separate for manual review.
    groups:
      terraform-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: scope
    # Minor/patch updates in one PR; majors stay separate for manual review.
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - "python"
    # Minor/patch updates in one PR; majors stay separate for manual review.
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
