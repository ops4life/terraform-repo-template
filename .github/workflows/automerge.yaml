name: Auto-merge PR

on: pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  automerge:
    runs-on: ubuntu-24.04
    if: |
      startsWith(github.head_ref, 'update-license-') ||
      github.head_ref == 'update-pre-commit-hooks' ||
      github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Fail closed: Dependabot PRs auto-merge only when explicitly minor or patch.
      # Majors (and anything fetch-metadata cannot classify) stay open for manual review.
      - name: Enable auto-merge
        if: github.actor != 'dependabot[bot]' || steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
