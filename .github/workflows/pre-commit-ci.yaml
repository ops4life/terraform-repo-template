name: Pre-commit CI
on:
  pull_request_target:

jobs:
  pre-commit:
    # pull_request_target runs with a write token: never check out fork code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        if: github.actor != 'dependabot[bot]'
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0 # mkdocs --strict aborts on the git-revision-date plugin's shallow-clone warning
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Install Terraform-docs
        uses: jaxxstorm/action-install-gh-release@v4.0.0
        with:
          repo: terraform-docs/terraform-docs
          platform: linux
          arch: amd64

      - name: Install Checkov
        run: pipx install checkov

      - name: Install GitLeaks
        run: |
          mkdir -p $RUNNER_TEMP/gitleaks
          latest_version=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep 'tag_name' | cut -d\" -f4)
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/$latest_version/gitleaks_${latest_version#v}_linux_x64.tar.gz -o $RUNNER_TEMP/gitleaks/gitleaks.tar.gz
          tar -xvzf $RUNNER_TEMP/gitleaks/gitleaks.tar.gz -C $RUNNER_TEMP/gitleaks
          sudo mv $RUNNER_TEMP/gitleaks/gitleaks /usr/local/bin/

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: |
          pre-commit install
          pre-commit run --all-files

      - uses: stefanzweifel/git-auto-commit-action@v7
        if: always()
        with:
          commit_message: "fix: Automated Changes by Pre-commit"
